  <script>
  (function () {
    var cfg = window.MK11_BANNER;
    if (!cfg || !cfg.active) return;
    var KEY = 'mk11-banner-' + cfg.id;
    try { if (localStorage.getItem(KEY) === 'dismissed') return; } catch (_) {}

    // Apply layout class before first paint so lang-toggle renders in correct position.
    document.documentElement.classList.add('has-banner');

    // Wire up banner after DOM is ready.
    document.addEventListener('DOMContentLoaded', function () {
      var banner      = document.getElementById('site-banner');
      var textEl      = document.getElementById('site-banner-text');
      var textMobile  = document.getElementById('site-banner-text-mobile');
      var ctaEl       = document.getElementById('site-banner-cta');
      var bodyBtn     = document.getElementById('site-banner-body');
      if (!banner || !textEl) return;

      function currentLang() {
        try { return localStorage.getItem('mk11_lang') || 'kr'; } catch(_) { return 'kr'; }
      }
      function setText() {
        var lang = currentLang();
        var isEn = lang === 'en';
        textEl.textContent     = isEn ? (cfg.en        || cfg.kr)        : (cfg.kr        || cfg.en);
        if (textMobile) textMobile.textContent = isEn ? (cfg.en_mobile  || cfg.en) : (cfg.kr_mobile  || cfg.kr);
        if (ctaEl) {
          var ctaText = isEn ? (cfg.cta_en || cfg.cta_kr) : (cfg.cta_kr || cfg.cta_en);
          ctaEl.textContent = ctaText;
          ctaEl.style.display = ctaText ? '' : 'none';
        }
      }
      setText();
      banner.hidden = false;

      var ltBtn = document.getElementById('lang-toggle-btn');
      if (ltBtn) ltBtn.addEventListener('click', setText);

      if (bodyBtn) {
        bodyBtn.addEventListener('click', function () {
          if (cfg.href) {
            // In-page anchor (#section): smooth scroll.
            // Otherwise (absolute path or external URL): navigate.
            //   - new_tab: true OR external URL  -> open in new tab
            //   - new_tab: false / omitted, internal path -> same window
            if (cfg.href.charAt(0) === '#') {
              var target = document.querySelector(cfg.href);
              if (target) target.scrollIntoView({ behavior: 'smooth' });
            } else {
              var isExternal = /^https?:\/\//i.test(cfg.href);
              if (cfg.new_tab === true || isExternal) {
                window.open(cfg.href, '_blank', 'noopener,noreferrer');
              } else {
                window.location.href = cfg.href;
              }
              return; // navigation is final; skip channel handling below
            }
          }
          if (cfg.channel) {
            setTimeout(function () {
              var card = document.querySelector('.install-card[data-channel="' + cfg.channel + '"]');
              if (!card) return;
              card.click();
              card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
            }, 450);
          }
        });
      }

    });
  }());
  </script>

  /* Hold the hero entrance animation until the splash (loading) lifts.
     Otherwise it plays out during loading and looks "already finished" on reveal.
     Without JS the class is never added, so the hero plays normally (a11y fallback).
     A 6s safety release ensures the page isn't trapped if loading.js never runs. */
  (function () {
    var d = document.documentElement;
    d.classList.add('mk11-loading');
    setTimeout(function () { d.classList.remove('mk11-loading'); }, 6000);
  })();
  </script>

  <script>
  /* Hero eyebrow: render content.js "ver X.Y (DATE)" as chip (vX.Y) + muted date.
     The content.js value is left unchanged, so the release_meta regexes still match (display only). */
  (function () {
    var el = document.getElementById('hero-eyebrow');
    var raw = window.MK11_CONTENT && window.MK11_CONTENT['hero.eyebrow'];
    if (!el || !raw) return;
    var m = /ver\s+([\d.]+)\s*\((\d{4})-(\d{2})-(\d{2})\)/.exec(raw);
    if (!m) { el.textContent = raw; return; }
    var ver = 'v' + m[1], date = m[2] + '.' + m[3] + '.' + m[4];
    var chip = document.createElement('span'); chip.className = 'hero-ver-chip'; chip.textContent = ver;
    var d = document.createElement('span'); d.className = 'hero-ver-date'; d.textContent = date;
    el.textContent = ''; el.appendChild(chip); el.appendChild(d);
    el.setAttribute('aria-label', ver + ' · ' + date);
  })();
  </script>
  <script>
  document.addEventListener('mousemove', function (e) {
    var card = e.target.closest('.reveal');
    if (!card) return;
    var r = card.getBoundingClientRect();
    card.style.setProperty('--x', (e.clientX - r.left) + 'px');
    card.style.setProperty('--y', (e.clientY - r.top) + 'px');
  });
  </script>
  <script>
  (function () {
    var collapse  = document.getElementById('about-collapse');
    var toggleBtn = document.getElementById('about-toggle');
    var moreSpan  = document.getElementById('about-toggle-more');
    var lessSpan  = document.getElementById('about-toggle-less');

    toggleBtn.addEventListener('click', function () {
      var open = collapse.classList.toggle('about-collapse--open');
      toggleBtn.classList.toggle('is-open', open);
      moreSpan.hidden = open;
      lessSpan.hidden = !open;
      if (!open) {
        collapse.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  }());
